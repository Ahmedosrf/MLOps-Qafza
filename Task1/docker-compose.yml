services:
  postgres:
    image: postgres:16-alpine
    container_name: olist-postgres-task1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: olist
    ports:
      - "5432:5432"
    volumes:
      - task1_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  task1_postgres_data:
