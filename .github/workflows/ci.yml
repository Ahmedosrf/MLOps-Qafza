name: Task 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Lint, format, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Task3/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r Task3/requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check Task3 Task2/src/improve_model.py Task2/src/diagnose_model.py

      - name: Check Black formatting
        run: black --check Task3 Task2/src/improve_model.py Task2/src/diagnose_model.py

      - name: Run tests
        run: python -m pytest -q Task3/tests

  docker-build:
    name: Build API image
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -r Task3/requirements.txt

      - name: Create fitted synthetic bundle for image smoke test only
        run: python -m Task3.tests.ci_bundle Task3/models/06_inference_bundle.joblib

      - name: Build API image
        run: docker build -f Task3/Dockerfile -t olist-late-delivery-api:ci .

      - name: Smoke test non-root container and prediction endpoints
        shell: bash
        run: |
          docker run -d --name api -p 8000:8000 olist-late-delivery-api:ci
          trap 'docker logs api; docker rm -f api' EXIT
          test "$(docker exec api id -u)" = "10001"
          python - <<'PYTHON'
          import json, time, urllib.request
          from Task3.tests.ci_bundle import ORDER
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://localhost:8000/ready', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Container never became ready')
          request = urllib.request.Request('http://localhost:8000/predict', data=json.dumps(ORDER).encode(), headers={'Content-Type': 'application/json'})
          result = json.load(urllib.request.urlopen(request, timeout=10))
          assert result['model_version'] == 'ci-synthetic-only'
          assert 0 <= result['probability'] <= 1
          PYTHON
