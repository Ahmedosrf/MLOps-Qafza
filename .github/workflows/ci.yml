name: Task 3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Lint, format, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Task3/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r Task3/requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check Task3

      - name: Check Black formatting
        run: black --check Task3

      - name: Run tests
        run: python -m pytest -q Task3/tests

  docker-build:
    name: Build API image
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for local model bundle
        id: model
        shell: bash
        run: |
          if [ -f Task2/artifacts/models/06_inference_bundle.joblib ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image when the model bundle is available
        if: steps.model.outputs.available == 'true'
        run: docker build -f Task3/Dockerfile -t olist-late-delivery-api:ci .

      - name: Explain skipped Docker build
        if: steps.model.outputs.available != 'true'
        run: echo "Docker build skipped because the private model bundle is not in Git."
