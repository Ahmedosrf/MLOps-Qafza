[project]
name = "olist-late-delivery-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
description = "FastAPI inference service for the Olist late-delivery model"

[tool.pytest.ini_options]
pythonpath = ["..", ".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ["py311"]
